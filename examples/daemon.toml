# Relative paths resolve from this file's directory. Change the UID for the
# account that runs Baffle, and create state/ before initializing the CA.
[daemon]
control_socket = "run/control.sock"
socket_dir = "run/proxies"
trusted_operator_uid = 1000
max_sessions = 64
max_connections_per_session = 128
shutdown_grace_seconds = 5
control_read_timeout_ms = 5000
max_provisioning_requests = 8
io_timeout_ms = 30000

[ca]
certificate = "state/ca.pem"
private_key = "state/ca-key.pem"

[secrets]
directory = "state/secrets"
allowed = ["example-api"]
