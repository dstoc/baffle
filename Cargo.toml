[package]
name = "baffle-proxy"
version = "0.1.0"
edition = "2024"
description = "A standalone daemon for policy-controlled HTTP and HTTPS proxies"

[[bin]]
name = "baffle"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hudsucker = { version = "=0.25.0", features = ["http2"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.27.0"
