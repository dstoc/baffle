[package]
name = "baffle-proxy"
version = "0.1.0"
edition = "2024"
description = "A standalone daemon for policy-controlled HTTP and HTTPS proxies"

[workspace]
members = ["crates/baffle-client"]
default-members = [".", "crates/baffle-client"]
resolver = "3"

[[bin]]
name = "baffle"
path = "src/main.rs"

[dependencies]
baffle-client = { path = "crates/baffle-client" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hudsucker = { version = "=0.25.0", features = ["http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower-service = "0.3.3"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
x509-parser = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio-rustls = "0.26.5"

[patch.crates-io]
hudsucker = { path = "vendor/hudsucker" }
