[package]
name = "baffle-client"
version = "0.1.0"
edition = "2024"
description = "Typed client for the Baffle Unix control protocol"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "net"] }
toml = "1.1.6"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
