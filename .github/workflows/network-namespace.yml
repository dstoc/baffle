name: Network namespace isolation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  namespace-integration:
    name: Privileged network namespace integration (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: Hudsucker
            feature: backend-hudsucker
            rust_minimum: stable
            native_packages: ''
          - backend: Rama
            feature: backend-rama
            rust_minimum: '1.96'
            native_packages: build-essential cmake libclang-dev
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rama native build tools
        if: matrix.backend == 'Rama'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.native_packages }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install namespace test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 openssl

      - name: Build Baffle daemon
        run: cargo build --locked --bin baffle --no-default-features --features ${{ matrix.feature }}

      - name: Run privileged namespace integration
        run: sudo python3 scripts/test-network-namespace-isolation.py --binary target/debug/baffle
