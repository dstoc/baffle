name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recover_release:
        description: Run the guarded backfill for a merged release that Release Please did not report
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created == 'true' && 'true' || steps.recover_release.outputs.release_created || 'false' }}
      tag_name: ${{ steps.release.outputs.release_created == 'true' && steps.release.outputs.tag_name || steps.recover_release.outputs.tag_name || '' }}
      sha: ${{ steps.release.outputs.release_created == 'true' && steps.release.outputs.sha || steps.recover_release.outputs.sha || '' }}
      package_binaries: ${{ steps.release.outputs.release_created == 'true' && 'true' || steps.recover_release.outputs.package_binaries || 'false' }}
      publish_crates: ${{ steps.release.outputs.release_created == 'true' && 'true' || steps.recover_release.outputs.publish_crates || 'false' }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pull_requests: ${{ steps.release-pr.outputs.pull_requests }}
    steps:
      - name: Create or update the release pull request
        id: release
        # v4.4.1 bundles release-please@17.3.0, the version-selection fixture in CI.
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Test Release Please output handling and recovery
        run: python3 -m unittest scripts.test_release_please_outputs scripts.test_recover_pending_release scripts.test_publish_crates

      - name: Normalize optional Release Please pull request outputs
        id: release-pr
        env:
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
          PRS_JSON: ${{ steps.release.outputs.prs }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: python3 scripts/release_please_outputs.py

      - name: Backfill a merged release after explicit manual request
        id: recover_release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_release == true && steps.release.outputs.release_created != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/recover_pending_release.py

  synchronize-release-candidates:
    needs: release-please
    if: ${{ needs.release-please.result == 'success' && needs.release-please.outputs.prs_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        release_pr: ${{ fromJSON(needs.release-please.outputs.pull_requests) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out generated release pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.release_pr.headBranchName }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96

      - name: Synchronize generated Cargo release candidate
        run: python3 scripts/sync_release_please_candidate.py

      - name: Validate generated Cargo workspace
        run: cargo metadata --locked --format-version 1

      - name: Check synchronized release versions
        run: python3 -m unittest scripts.test_release_please_manifests scripts.test_release_please_candidate scripts.test_publish_crates

      - name: Commit synchronized release candidate
        env:
          RELEASE_PR_BRANCH: ${{ matrix.release_pr.headBranchName }}
        run: |
          if ! git diff --quiet -- Cargo.toml crates/baffle-client/Cargo.toml .release-please-manifest.json Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml crates/baffle-client/Cargo.toml .release-please-manifest.json Cargo.lock
            git commit -m "fix(release): synchronize generated Cargo candidate"
            git push origin "HEAD:${RELEASE_PR_BRANCH}"
          fi

      - name: Dispatch Rust CI for generated release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_PR_BRANCH: ${{ matrix.release_pr.headBranchName }}
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          gh workflow run ci.yml \
            --repo "$REPOSITORY" \
            --ref "$RELEASE_PR_BRANCH" \
            --field ref="$candidate_sha"

  validate-release:
    needs: [release-please, synchronize-release-candidates]
    if: ${{ !cancelled() && needs.release-please.result == 'success' && (needs.synchronize-release-candidates.result == 'success' || needs.synchronize-release-candidates.result == 'skipped') && needs.release-please.outputs.release_created == 'true' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}
    permissions:
      contents: read

  package-binaries:
    needs: [release-please, validate-release]
    if: ${{ !cancelled() && needs.release-please.result == 'success' && needs.validate-release.result == 'success' && needs.release-please.outputs.package_binaries == 'true' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      release_sha: ${{ needs.release-please.outputs.sha }}
    permissions:
      contents: write
      pull-requests: read

  publish-crates:
    needs: [release-please, validate-release]
    if: ${{ !cancelled() && needs.release-please.result == 'success' && needs.validate-release.result == 'success' && needs.release-please.outputs.publish_crates == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: baffle-crates-io-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out the exact Release Please tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Verify GitHub Release, tag, commit, and crate versions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: python3 scripts/publish_crates.py verify-release --repo "$REPOSITORY" --tag "$RELEASE_TAG" --release-sha "$RELEASE_SHA"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96

      - name: Validate package contents and client package build
        run: |
          cargo metadata --locked --format-version 1
          cargo package --list --locked --package baffle-client
          cargo package --list --locked --package baffle-proxy
          cargo publish --dry-run --locked --package baffle-client

      - name: Publish both crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: python3 scripts/publish_crates.py publish --tag "$RELEASE_TAG"
