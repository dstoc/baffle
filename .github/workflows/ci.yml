name: Rust CI

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check in a Release Please run
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Rama checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Install Rama native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libclang-dev

      - name: Install Rust components
        uses: dtolnay/rust-toolchain@1.96
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Test network namespace checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate locked Cargo metadata
        run: cargo metadata --locked --format-version 1

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        env:
          RUSTFLAGS: --cfg baffle_integration_test
        run: cargo test --locked

      - name: Compile Rust examples
        run: cargo check --locked --examples

      - name: Run release tests
        env:
          RUSTFLAGS: --cfg baffle_integration_test
        run: cargo test --locked --release

  namespace-integration:
    name: Network namespace integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rama native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install namespace test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 openssl

      - name: Build Baffle daemon
        run: cargo build --locked --bin baffle

      - name: Run privileged namespace integration
        run: sudo python3 scripts/test-network-namespace-isolation.py --binary target/debug/baffle

  required-checks:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    needs: [checks, namespace-integration]
    if: ${{ always() }}
    steps:
      - name: Require Rust and namespace checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          NAMESPACE_RESULT: ${{ needs.namespace-integration.result }}
        run: |
          if [ "$CHECKS_RESULT" != "success" ] || [ "$NAMESPACE_RESULT" != "success" ]; then
            echo "Rust result was $CHECKS_RESULT and namespace result was $NAMESPACE_RESULT; both must succeed."
            exit 1
          fi
