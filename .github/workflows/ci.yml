name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, and test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: Hudsucker
            feature: backend-hudsucker
            rust_minimum: stable
            native_packages: ''
          - backend: Rama
            feature: backend-rama
            rust_minimum: '1.96'
            native_packages: build-essential cmake libclang-dev
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rama native build tools
        if: matrix.backend == 'Rama'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.native_packages }}

      - name: Install Rust components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Test network namespace checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --no-default-features --features ${{ matrix.feature }} -- -D warnings

      - name: Run tests
        env:
          RUSTFLAGS: --cfg baffle_integration_test
        run: cargo test --locked --no-default-features --features ${{ matrix.feature }}

      - name: Compile Rust examples
        run: cargo check --locked --examples --no-default-features --features ${{ matrix.feature }}

      - name: Run release tests
        env:
          RUSTFLAGS: --cfg baffle_integration_test
        run: cargo test --locked --release --no-default-features --features ${{ matrix.feature }}

  namespace-integration:
    name: Network namespace integration (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: Hudsucker
            feature: backend-hudsucker
            rust_minimum: stable
            native_packages: ''
          - backend: Rama
            feature: backend-rama
            rust_minimum: '1.96'
            native_packages: build-essential cmake libclang-dev
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rama native build tools
        if: matrix.backend == 'Rama'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.native_packages }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install namespace test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 openssl

      - name: Build Baffle daemon
        run: cargo build --locked --bin baffle --no-default-features --features ${{ matrix.feature }}

      - name: Run privileged namespace integration
        run: sudo python3 scripts/test-network-namespace-isolation.py --binary target/debug/baffle

  required-checks:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    needs: [checks, namespace-integration]
    if: ${{ always() }}
    steps:
      - name: Require all backend and namespace matrix entries to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          NAMESPACE_RESULT: ${{ needs.namespace-integration.result }}
        run: |
          if [ "$CHECKS_RESULT" != "success" ] || [ "$NAMESPACE_RESULT" != "success" ]; then
            echo "Backend result was $CHECKS_RESULT and namespace result was $NAMESPACE_RESULT; both must succeed."
            exit 1
          fi
