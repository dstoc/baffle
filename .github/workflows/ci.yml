name: Rust CI

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check in a Release Please run
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Rama checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Install Rama native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libclang-dev

      - name: Install Rust components
        uses: dtolnay/rust-toolchain@1.96
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Test network namespace checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate locked Cargo metadata
        run: cargo metadata --locked --format-version 1

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        env:
          RUSTFLAGS: --cfg baffle_integration_test
        run: cargo test --locked

      - name: Compile Rust examples
        run: cargo check --locked --examples

      - name: Run release tests
        env:
          RUSTFLAGS: --cfg baffle_integration_test
        run: cargo test --locked --release

  namespace-integration:
    name: Network namespace integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rama native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install namespace test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 openssl

      - name: Build Baffle daemon
        run: cargo build --locked --bin baffle

      - name: Run privileged namespace integration
        run: sudo python3 scripts/test-network-namespace-isolation.py --binary target/debug/baffle

  macos-unix-integration:
    name: Apple Silicon Unix socket integration
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Assert Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install Rama native build tools
        shell: bash
        run: |
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install Rust 1.96 and Apple Silicon target
        uses: dtolnay/rust-toolchain@1.96
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Baffle and run CLI version check
        run: |
          cargo build --locked --target aarch64-apple-darwin --bin baffle
          ./target/aarch64-apple-darwin/debug/baffle --version

      - name: Run native daemon, policy, lease, and Unix proxy integration
        env:
          RUSTFLAGS: --cfg baffle_integration_test
          RUST_BACKTRACE: "1"
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -o pipefail
          set +e
          cargo test --locked --target aarch64-apple-darwin --lib \
            --test daemon_lifecycle --test daemon_proxy -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/macos-unix-integration.log"
          test_status=$?
          set -e
          if (( test_status != 0 )); then
            python3 - <<'PY'
          import os
          from pathlib import Path

          log_path = Path(os.environ["RUNNER_TEMP"]) / "macos-unix-integration.log"
          output = log_path.read_text(encoding="utf-8", errors="replace")
          message = "Native integration output (last 3500 characters):\n" + output[-3500:]
          message = (
              message.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(
              "::error file=.github/workflows/ci.yml,line=140,title=Native macOS integration failure::"
              + message
          )
          PY
          fi
          exit "$test_status"

      - name: Preserve failed native integration output
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-unix-integration-log
          path: ${{ runner.temp }}/macos-unix-integration.log
          if-no-files-found: ignore
          retention-days: 3

  required-checks:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    needs: [checks, namespace-integration, macos-unix-integration]
    if: ${{ always() }}
    steps:
      - name: Require Rust and namespace checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          NAMESPACE_RESULT: ${{ needs.namespace-integration.result }}
          MACOS_RESULT: ${{ needs.macos-unix-integration.result }}
        run: |
          if [ "$CHECKS_RESULT" != "success" ] || [ "$NAMESPACE_RESULT" != "success" ] || [ "$MACOS_RESULT" != "success" ]; then
            echo "Rust result was $CHECKS_RESULT, namespace result was $NAMESPACE_RESULT, and macOS result was $MACOS_RESULT; all must succeed."
            exit 1
          fi
