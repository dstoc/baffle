name: Rust CI

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check in a Release Please run
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to check in a manually dispatched run
        required: false
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Rama checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Test Release Please version selection
        shell: bash
        env:
          RELEASE_PLEASE_ACTION_SHA: 8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5
        run: |
          fixture_dir="$RUNNER_TEMP/release-please-fixture"
          mkdir -p "$fixture_dir"
          action_source="https://raw.githubusercontent.com/googleapis/release-please-action/$RELEASE_PLEASE_ACTION_SHA"
          curl --fail --silent --show-error --location "$action_source/package.json" \
            --output "$fixture_dir/package.json"
          curl --fail --silent --show-error --location "$action_source/package-lock.json" \
            --output "$fixture_dir/package-lock.json"
          npm ci --prefix "$fixture_dir" --omit=dev --ignore-scripts --no-audit --no-fund
          RELEASE_PLEASE_FIXTURE_PACKAGE="$RUNNER_TEMP/release-please-fixture/node_modules/release-please" \
            node scripts/test_release_please_version_selection.cjs

      - name: Install Rama native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libclang-dev

      - name: Install Rust components
        uses: dtolnay/rust-toolchain@1.96
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Test network namespace checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate locked Cargo metadata
        run: cargo metadata --locked --format-version 1

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        env:
          RUSTFLAGS: --cfg baffle_integration_test
        run: cargo test --locked

      - name: Compile Rust examples
        run: cargo check --locked --examples

      - name: Run release tests
        env:
          RUSTFLAGS: --cfg baffle_integration_test
        run: cargo test --locked --release

  namespace-integration:
    name: Network namespace integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rama native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install namespace test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 openssl

      - name: Build Baffle daemon
        run: cargo build --locked --bin baffle

      - name: Run privileged namespace integration
        run: sudo python3 scripts/test-network-namespace-isolation.py --binary target/debug/baffle

  macos-unix-integration:
    name: Apple Silicon Unix socket integration
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Assert Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install Rama native build tools
        shell: bash
        run: |
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install Rust 1.96 and Apple Silicon target
        uses: dtolnay/rust-toolchain@1.96
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Baffle and run CLI version check
        run: |
          cargo build --locked --target aarch64-apple-darwin --bin baffle
          ./target/aarch64-apple-darwin/debug/baffle --version

      - name: Run native daemon, policy, lease, and Unix proxy integration
        env:
          RUSTFLAGS: --cfg baffle_integration_test
          RUST_BACKTRACE: "1"
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -o pipefail
          set +e
          cargo test --locked --target aarch64-apple-darwin --lib \
            --test daemon_lifecycle --test daemon_proxy -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/macos-unix-integration.log"
          test_status=$?
          set -e
          if (( test_status != 0 )); then
            python3 - <<'PY'
          import os
          from pathlib import Path

          log_path = Path(os.environ["RUNNER_TEMP"]) / "macos-unix-integration.log"
          output = log_path.read_text(encoding="utf-8", errors="replace")
          lines = output.splitlines()
          panic_context = []
          for index, line in enumerate(lines):
              if "panicked at" in line:
                  start = max(0, index - 1)
                  end = min(len(lines), index + 9)
                  panic_context.append("\n".join(lines[start:end]))
          details = "\n\n".join(panic_context)
          tail = output[-3500:]
          message = "Native integration failure details:\n"
          if details:
              message += "Panic context:\n" + details + "\n\n"
          message += "Output tail:\n" + tail
          message = (
              message.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(
              "::error file=.github/workflows/ci.yml,line=140,title=Native macOS integration failure::"
              + message
          )
          PY
          fi
          exit "$test_status"

      - name: Preserve failed native integration output
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-unix-integration-log
          path: ${{ runner.temp }}/macos-unix-integration.log
          if-no-files-found: ignore
          retention-days: 3

  release-packages:
    name: Build release archive ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Assert native runner architecture
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET:$(uname -s):$(uname -m)" in
            x86_64-unknown-linux-gnu:Linux:x86_64|aarch64-apple-darwin:Darwin:arm64) ;;
            *) echo "Runner architecture does not match $TARGET: $(uname -s) $(uname -m)" >&2; exit 1 ;;
          esac

      - name: Install Linux native build tools
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: sudo apt-get update && sudo apt-get install --yes build-essential cmake libclang-dev

      - name: Install Apple Silicon native build tools
        if: ${{ matrix.target == 'aarch64-apple-darwin' }}
        shell: bash
        run: |
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install Rust 1.96 and target
        uses: dtolnay/rust-toolchain@1.96
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build and package the target archive
        id: package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "baffle-proxy") | .version')"
          tag="v${version}"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          ./scripts/package-release.sh "$tag" "$TARGET" dist

      - name: Upload target archive for checksum validation
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/baffle-proxy-${{ steps.package.outputs.tag }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  verify-release-packages:
    name: Verify both release archives and combined checksums
    needs: release-packages
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Download both target archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify architecture, legal files, and combined checksums
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "baffle-proxy") | .version')"
          ./scripts/verify-release-archives.sh "v${version}" dist

  required-checks:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    needs: [checks, namespace-integration, macos-unix-integration, verify-release-packages]
    if: ${{ always() }}
    steps:
      - name: Require Rust and namespace checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          NAMESPACE_RESULT: ${{ needs.namespace-integration.result }}
          MACOS_RESULT: ${{ needs.macos-unix-integration.result }}
          PACKAGES_RESULT: ${{ needs.verify-release-packages.result }}
        run: |
          if [ "$CHECKS_RESULT" != "success" ] || [ "$NAMESPACE_RESULT" != "success" ] || [ "$MACOS_RESULT" != "success" ] || [ "$PACKAGES_RESULT" != "success" ]; then
            echo "Rust result was $CHECKS_RESULT, namespace result was $NAMESPACE_RESULT, macOS result was $MACOS_RESULT, and release-package result was $PACKAGES_RESULT; all must succeed."
            exit 1
          fi
