name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, and test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: Hudsucker
            feature: backend-hudsucker
          - backend: Rama
            feature: backend-rama
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rama native build tools
        if: matrix.backend == 'Rama'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libclang-dev

      - name: Install Rust components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Test network namespace checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --no-default-features --features ${{ matrix.feature }} -- -D warnings

      - name: Run tests
        run: cargo test --locked --no-default-features --features ${{ matrix.feature }}

      - name: Compile Rust examples
        if: matrix.backend == 'Hudsucker'
        run: cargo check --locked --examples --no-default-features --features ${{ matrix.feature }}

      - name: Run release tests
        run: cargo test --locked --release --no-default-features --features ${{ matrix.feature }}

  required-checks:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    needs: [checks]
    if: ${{ always() }}
    steps:
      - name: Require both backend matrix entries to pass
        env:
          MATRIX_RESULT: ${{ needs.checks.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Backend matrix result was $MATRIX_RESULT; expected success."
            exit 1
          fi
